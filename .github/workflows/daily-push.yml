name: 钉钉每日日程推送

on:
  # 方式一：GitHub 内置定时（UTC 时间）
  schedule:
    # 每天北京时间 07:00 和 21:00 触发（UTC 23:00 和 13:00）
    - cron: '0 23 * * *'
    - cron: '0 13 * * *'

  # 方式二：外部精确调度（cron-job.org 可触发此事件）
  repository_dispatch:
    types: [trigger-calendar-push]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run calendar push
        env:
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_USER_ID: ${{ secrets.DINGTALK_USER_ID }}
          DINGTALK_CALENDAR_ID: ${{ secrets.DINGTALK_CALENDAR_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          WEATHER_CITIES: ${{ secrets.WEATHER_CITIES }}
          # 可选：如需单城市，可取消注释并添加对应 Secret
          # WEATHER_CITY: ${{ secrets.WEATHER_CITY }}
        run: python dingtalk_calendar_ga.py
