name: 钉钉每日日程推送

on:
  # 仅由 cron-job.org 通过 repository_dispatch 精确触发
  repository_dispatch:
    types: [scheduled-run]
  # 保留手动触发作为调试备用
  workflow_dispatch:

jobs:
  push-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行推送脚本
        env:
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_USER_ID: ${{ secrets.DINGTALK_USER_ID }}
          DINGTALK_CALENDAR_ID: ${{ secrets.DINGTALK_CALENDAR_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: python dingtalk_calendar_bot.py
