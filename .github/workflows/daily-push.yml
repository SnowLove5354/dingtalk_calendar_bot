name: 钉钉每日日程推送

on:
  # ❌ 移除原生 schedule（有延迟问题）
   schedule:
     - cron: '00 00 * * *'
     - cron: '00 14 * * 1-5'

  # ✅ 保留 workflow_dispatch 用于外部 API 精确触发
  workflow_dispatch:
    inputs:
      push_type:
        description: '推送类型 (morning/evening/manual)'
        required: false
        default: 'auto'
        type: string

  # ✅ 保留 repository_dispatch 作为备用触发方式
  repository_dispatch:
    types: [cron-trigger]

jobs:
  push-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行推送脚本
        env:
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_USER_ID: ${{ secrets.DINGTALK_USER_ID }}
          DINGTALK_CALENDAR_ID: ${{ secrets.DINGTALK_CALENDAR_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          PUSH_TYPE: ${{ github.event.inputs.push_type || 'auto' }}  # 接收触发参数
        run: python dingtalk_calendar_bot.py
