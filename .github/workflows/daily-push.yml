name: 钉钉每日日程推送

on:
  # 通过 cron-job.org 等外部服务精确触发（需配置 repository_dispatch）
  repository_dispatch:
    types: [scheduled-run]
  # 保留 GitHub 原生定时作为备用（存在 5~15 分钟延迟）
  schedule:
    # 北京时间每日 8:00 (UTC 0:00)
#    - cron: '0 0 * * *'
    # 北京时间工作日 22:00 (UTC 14:00)
#    - cron: '0 14 * * 1-5'
  # 保留手动触发
  workflow_dispatch:

jobs:
  push-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行推送脚本
        env:
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_USER_ID: ${{ secrets.DINGTALK_USER_ID }}
          DINGTALK_CALENDAR_ID: ${{ secrets.DINGTALK_CALENDAR_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: python dingtalk_calendar_bot.py
